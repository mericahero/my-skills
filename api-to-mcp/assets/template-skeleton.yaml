# ============================================================
# 模板 1：多租户透传模式（推荐）
# 客户端凭证透传到后端，支持多用户
# ============================================================

server:
  name: "your-service-name"          # 必填：服务名称（小写 + 连字符）
  type: "rest"                        # 可选，默认 rest
  timeout: 36000                      # 超时时间（毫秒）
  config:                             # 可选：服务端配置
    apiKey: "your-api-key"
  # passthroughAuthHeader: false      # 是否透传 Authorization 请求头（默认 false）
  securitySchemes:                    # 认证方案定义
    - id: YourAuthScheme              # 认证方案 ID
      type: apiKey                    # 类型：apiKey / http
      in: header                      # apiKey 位置：header / query
      name: "Your-Token-Header"       # 请求头名称或查询参数名
      # defaultCredential: "xxx"      # 默认凭证（静态模式用）
  defaultDownstreamSecurity:          # 客户端到网关认证
    id: YourAuthScheme
    passthrough: true                 # 多租户：设为 true
  # defaultUpstreamSecurity:          # 静态模式：用这个替代
  #   id: YourAuthScheme

tools:
  # ========== 查询/列表工具 ==========
  - name: "list_resources"
    description: "分页查询资源列表"
    args:
      - name: search
        description: "搜索关键词"
        type: string
        required: false
      - name: page
        description: "页码"
        type: integer
        required: false
        default: 1
        position: query
      - name: per_page
        description: "每页条数"
        type: integer
        required: false
        default: 20
        position: query
    requestTemplate:
      method: GET
      security:
        id: YourAuthScheme
      url: "http://your-api-host/api/v1/resources?page={{.args.page}}&per_page={{.args.per_page}}"
      headers:
        - key: Content-Type
          value: application/json
    responseTemplate:
      body: |
        # 资源列表
        当前页: {{.meta.current_page}}
        总数: {{.meta.total_count}}
        {{range $idx, $item := .data}}
        ### 资源 {{add $idx 1}}
        - ID: {{$item.id}}
        - 名称: {{$item.name}}
        {{end}}

  # ========== 创建工具 ==========
  - name: "create_resource"
    description: "创建新资源"
    args:
      - name: name
        description: "资源名称"
        type: string
        required: true
      - name: description
        description: "资源描述"
        type: string
        required: false
    requestTemplate:
      method: POST
      security:
        id: YourAuthScheme
      url: "http://your-api-host/api/v1/resources"
      headers:
        - key: Content-Type
          value: application/json
      body: |
        {
          "name": "{{.args.name}}",
          "description": "{{.args.description}}"
        }
    responseTemplate:
      body: |
        # 创建结果
        资源 ID: {{.id}}
        资源名称: {{.name}}
        创建时间: {{.created_at}}

  # ========== 路径参数工具 ==========
  - name: "get_resource_detail"
    description: "根据 ID 查询单个资源详情"
    args:
      - name: resource_id
        description: "资源 ID"
        type: string
        required: true
        position: path
    requestTemplate:
      method: GET
      security:
        id: YourAuthScheme
      url: "http://your-api-host/api/v1/resources/{{.args.resource_id}}"
    responseTemplate:
      body: |
        # 资源详情
        ID: {{.id}}
        名称: {{.name}}
        状态: {{.status}}
        {{if .metadata}}
        ## 扩展信息
        {{range $key, $value := .metadata}}
        - {{$key}}: {{$value}}
        {{end}}
        {{end}}

  # ========== 对比工具（含错误处理） ==========
  - name: "compare_resources"
    description: "对比两个资源并返回差异"
    args:
      - name: from_id
        description: "基准资源 ID"
        type: string
        required: true
      - name: to_id
        description: "目标资源 ID"
        type: string
        required: true
    errorResponseTemplate: |-
      HTTP 状态码: {{gjson "_headers.\\:status"}}
      资源对比失败，请检查参数。
    requestTemplate:
      method: GET
      security:
        id: YourAuthScheme
      url: "http://your-api-host/api/v1/resources/compare?from={{.args.from_id}}&to={{.args.to_id}}"
    responseTemplate:
      body: |-
        # 对比结果
        差异数: {{len .diffs}}
        {{range $item := .diffs}}
        ---
        字段: {{$item.field}}
        旧值: {{$item.old_value}}
        新值: {{$item.new_value}}
        {{end}}

  # ========== 无参数工具 ==========
  - name: "get_system_info"
    description: "获取系统基本信息"
    args: []
    requestTemplate:
      method: GET
      security:
        id: YourAuthScheme
      url: "http://your-api-host/api/v1/system/info"
    responseTemplate:
      body: |
        # 系统信息
        版本: {{.version}}
        运行时间: {{.uptime}}
        状态: {{.status}}

  # ========== 嵌套对象参数工具 ==========
  - name: "search_resources"
    description: "使用过滤条件搜索资源"
    args:
      - name: filters
        description: "过滤条件"
        type: object
        required: false
        properties:
          category:
            type: string
            enum: ["food", "hotel", "attraction"]
          price:
            type: integer
      - name: coordinates
        description: "坐标点列表"
        type: array
        items:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
    requestTemplate:
      method: POST
      security:
        id: YourAuthScheme
      url: "http://your-api-host/api/v1/resources/search"
      headers:
        - key: Content-Type
          value: application/json
      body: |
        {
          "filters": {{toJson .args.filters}},
          "coordinates": {{toJson .args.coordinates}}
        }
    responseTemplate:
      body: |
        # 搜索结果
        总数: {{.total}}
        {{range $idx, $item := .data}}
        ### 结果 {{add $idx 1}}
        - ID: {{$item.id}}
        - 名称: {{$item.name}}
        {{end}}

